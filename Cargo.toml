[package]
name = "starkom-poseidon2"
version = "6.5.0"
description = "Starkom's implementation of the Poseidon2 algebraic hash."
license = "Apache-2.0"
repository = "https://github.com/libernet-xyz/poseidon2.git"
readme = "README.md"
edition = "2024"

[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0.104"
primitive-types = "0.14.0"
sha3 = { version = "0.12.0", optional = true }
starkom-bluesky = { version = "3.4.0", optional = true }
starkom-ff = "3.0.0"
starkom-goldilocks = { version = "2.1.0", optional = true }

[features]
default = []
bls12_381 = []
bluesky = ["starkom-bluesky"]
cipher = ["sha3"]
goldilocks = ["starkom-goldilocks"]
