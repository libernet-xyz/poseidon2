[package]
name = "starkom-poseidon2"
version = "3.0.0"
description = "Starkom's implementation of the Poseidon2 algebraic hash."
license = "Apache-2.0"
repository = "https://github.com/libernet-xyz/poseidon2.git"
readme = "README.md"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
starkom-bluesky = { version = "3.0.0", optional = true }
starkom-ff = "2.0.1"

[dev-dependencies]
primitive-types = "0.14.0"

[features]
default = ["bluesky"]
bls12_381 = []
bluesky = ["starkom-bluesky"]
